    <!--
      Anti-flash theme script: runs BEFORE React renders.
      Reads saved preference (or OS preference) and sets data-theme on <html>
      so the correct CSS variables are active from the very first paint.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bsk-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
